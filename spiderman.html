<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="spiderman.css">
</head>

<body>
    <header>
        <nav>
            <img src="images/playstation_logo_hq.png" alt="">
            <div class="dropdowns">
                <h4>Games<i class="fa-solid fa-angle-down"></i></h4>
                <h4>News<i class="fa-solid fa-angle-down"></i></h4>
                <h4>Store<i class="fa-solid fa-angle-down"></i></h4>
                <h4>Services<i class="fa-solid fa-angle-down"></i></h4>

            </div>

            <div class="login">
                <button>Login</button>
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        </nav>
        <hr>
    </header>
    <main>
        <!-- left section -->
        <div class="leftSection">

            <div class="spiderIconsection">
                <img src="images/Spider-Man_video_game_series_logo.png" alt="">
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Nobis velit consectetur, illum possimus
                    quisquam odio!</p>
                <button>PRE-ORDER NOW</button>

            </div>
            <div class="socialIcons">
                <i class="fa-brands fa-facebook"></i>
                <i class="fa-brands fa-instagram"></i>
                <i class="fa-brands fa-x-twitter"></i>
            </div>
        </div>

        <!-- middle section -->
        <img src="images/spiderman_extract.png" alt="" class="spidy">

        <!-- Right Section -->
        <div class="rightection">
            <div class="gameReviewSection">
                <h3>GAME REVIEWS</h3>
                <div class="rateDiv">
                    <div class="circle">9.9</div>
                    <div class="text">
                        <span>IGN</span>
                        <p>- 'Lorem ipsum dolor sit.'</p>
                    </div>

                </div>

                <div class="rateDiv">
                    <div class="circle1">9.7</div>
                    <div class="text">
                        <span>IGN</span>
                        <p>- 'Lorem ipsum dolor sit.'</p>
                    </div>
                </div>

            </div>

            <div class="trailer">
                <h3>Watch trailer</h3>
                <iframe width="230" height="200" src="https://www.youtube.com/embed/shW9i6k8cB0?si=edzx_VAwLtwharnD"
                    title="YouTube video player" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>


        </div>

    </main>

</body>

</html>
